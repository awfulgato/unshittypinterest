<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>wyf</title>
  <style>
    html, body { margin:0; width:100%; height:100%; background:#000; color:#888; }
    body { min-height:100vh; overflow:hidden; position:relative; }
    .key-link {
      position:absolute; left:50%; top:48%; transform:translate(-50%,-50%);
      width:58px; height:58px; display:flex; align-items:center; justify-content:center;
      cursor:default; text-decoration:none; opacity:.88; transition:opacity .12s ease;
    }
    .key-link img { width:58px; height:58px; object-fit:contain; display:block; }
    .key-link:hover { opacity:1; }
    .password-box {
      position:absolute; left:50%; top:calc(48% + 66px); transform:translateX(-50%);
      width:102px; height:30px; display:none;
    }
    .password-box.visible { display:block; }
    .password-line {
      position:relative; width:100%; height:30px; border-bottom:1px solid #747474;
      transition:border-color .12s ease;
    }
    .password-line:focus-within { border-bottom-color:#949494; }
    .password-line input {
      position:absolute; inset:0; width:100%; height:100%; box-sizing:border-box;
      border:0; outline:0; background:transparent; color:transparent; caret-color:transparent;
      padding:0; margin:0; font-size:16px; text-align:center;
    }
    .password-marks {
      position:absolute; inset:0; display:flex; align-items:center; justify-content:center; gap:9px;
      pointer-events:none;
    }
    .scratch-cross {
      position:relative; width:7px; height:10px; opacity:0; transition:opacity .08s ease;
    }
    .scratch-cross.visible { opacity:1; }
    .scratch-cross::before, .scratch-cross::after {
      content:""; position:absolute; left:3px; top:0; width:1px; height:10px;
      background:#8b8b8b; transform-origin:center;
    }
    .scratch-cross::before { transform:rotate(42deg); }
    .scratch-cross::after  { transform:rotate(-48deg); }
    .scratch-cross:nth-child(2)::before { transform:rotate(46deg) translateY(.2px); }
    .scratch-cross:nth-child(2)::after  { transform:rotate(-44deg); height:9px; }
    .scratch-cross:nth-child(3)::before { transform:rotate(40deg); height:9px; }
    .scratch-cross:nth-child(3)::after  { transform:rotate(-50deg) translateY(.3px); }
    .scratch-cross:nth-child(4)::before { transform:rotate(45deg); }
    .scratch-cross:nth-child(4)::after  { transform:rotate(-46deg); height:9px; }
  </style>
</head>
<body>
  <a class="key-link" id="keyLink" href="#" aria-label="continue"><img src="key.png" alt="" aria-hidden="true"></a>
  <div class="password-box" id="passwordBox">
    <div class="password-line">
      <input id="password" type="password" autocomplete="off" spellcheck="false" aria-label="password">
      <div class="password-marks" aria-hidden="true">
        <span class="scratch-cross"></span><span class="scratch-cross"></span><span class="scratch-cross"></span><span class="scratch-cross"></span>
      </div>
    </div>
  </div>
  <script>
    const keyLink=document.getElementById('keyLink');
    const passwordBox=document.getElementById('passwordBox');
    const password=document.getElementById('password');
    const marks=[...document.querySelectorAll('.scratch-cross')];
    const updateMarks=()=>marks.forEach((mark,i)=>mark.classList.toggle('visible',i<Math.min(password.value.length,4)));
    keyLink.addEventListener('click',e=>{e.preventDefault();passwordBox.classList.add('visible');password.focus();updateMarks();});
    password.addEventListener('input',updateMarks);
    password.addEventListener('keydown',e=>{
      if(e.key==='Enter'){
        if(password.value==='caeg'){sessionStorage.setItem('wyf_unlocked','1');window.location.replace('nav.html?nav=wyf');}
        else {password.value='';updateMarks();}
      }
      if(e.key==='Escape'){passwordBox.classList.remove('visible');password.value='';updateMarks();}
    });
  </script>
</body>
</html>
