<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>wyf</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
    }
    body {
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }
    .key-link {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 64px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-decoration: none;
    }
    .key-link img {
      width: 64px;
      height: 64px;
      object-fit: contain;
      display: block;
    }
    .key-link:hover { opacity: .78; }
    .password-box {
      position: absolute;
      left: 50%;
      top: calc(50% + 75px);
      transform: translateX(-50%);
      display: none;
    }
    .password-box.visible { display: block; }
    .password-box input {
      width: 130px;
      height: 40px;
      box-sizing: border-box;
      border: 1px solid #fff;
      border-radius: 0;
      background: #000;
      color: #fff;
      padding: 7px 9px;
      outline: none;
      text-align: center;
      font: 14px/1 Arial, Helvetica, sans-serif;
    }
  </style>
</head>
<body>
  <a class="key-link" id="keyLink" href="#" aria-label="continue">
    <img src="key.png" alt="" aria-hidden="true">
  </a>

  <div class="password-box" id="passwordBox">
    <input id="password" type="password" autocomplete="off" spellcheck="false" aria-label="password">
  </div>

  <script>
    const keyLink = document.getElementById('keyLink');
    const passwordBox = document.getElementById('passwordBox');
    const password = document.getElementById('password');

    keyLink.addEventListener('click', event => {
      event.preventDefault();
      passwordBox.classList.add('visible');
      password.focus();
    });

    password.addEventListener('keydown', event => {
      if (event.key === 'Enter' && password.value === 'caeg') {
        window.location.href = 'nav.html?nav=wyf';
      }
      if (event.key === 'Escape') {
        passwordBox.classList.remove('visible');
        password.value = '';
      }
    });
  </script>
</body>
</html>
