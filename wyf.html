  <div class="password-box" id="passwordBox">
    <input id="password" type="password" autocomplete="off" spellcheck="false" aria-label="password">
  </div>
  <script>
    (() => {
      const keyLink = document.getElementById('keyLink');
      const passwordBox = document.getElementById('passwordBox');
      const password = document.getElementById('password');

      keyLink.addEventListener('click', (event) => {
        event.preventDefault();
        passwordBox.classList.add('visible');
        password.focus();
      });

      password.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          event.preventDefault();
          if (password.value === 'caeg') {
            sessionStorage.setItem('wyf_unlocked', '1');
            window.location.href = 'nav.html?nav=wyf';
          } else {
            password.value = '';
          }
        }
        if (event.key === 'Escape') {
          passwordBox.classList.remove('visible');
          password.value = '';
        }
      });
    })();
  </script>
