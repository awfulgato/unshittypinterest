<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>eskja</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="storeskja.css">
  <link rel="stylesheet" href="cursor.css">
  <link rel="stylesheet" href="storeskja-lid-mode.css">
</head>
<body class="nav-page">
  <a class="home-icon" href="index.html" aria-label="home" title="home">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 7.2 8 2.8l5.5 4.4M4 6.1v7h8v-7M6.7 13.1V9.3h2.6v3.8"/></svg>
  </a>

  <main class="nav-canvas" data-nav=""></main>

  <div class="storeskja-actions" aria-label="add entrance">
    <label class="storeskja-add" title="add lid" aria-label="add lid">
      <span>+</span>
      <input id="lidFileInput" type="file" accept="image/*,audio/*,video/*" multiple>
    </label>
    <button id="lidTextButton" class="storeskja-add" type="button" title="write lid" aria-label="write lid">&amp;</button>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const nav = params.get('nav') === 'wyf' ? 'wyf' : 'husbond';
    if (nav === 'wyf' && sessionStorage.getItem('wyf_unlocked') !== '1') {
      window.location.replace('wyf.html');
    } else {
      document.querySelector('.nav-canvas').dataset.nav = nav;
      document.body.dataset.nav = nav;
    }
  </script>
  <script type="module" src="storeskja-ui-fixes.js"></script>
  <script type="module" src="nav.js"></script>
  <script type="module" src="storeskja-lid-mode.js"></script>
</body>
</html>
