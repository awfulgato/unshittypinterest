<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>image board</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="board-page">
  <a class="home-icon" href="index.html" aria-label="home" title="home">
    <svg viewBox="0 0 16 16" aria-hidden="true">
      <path d="M2.5 7.2 8 2.8l5.5 4.4v6H9.9V9.7H6.1v3.5H2.5z" fill="none" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/>
    </svg>
  </a>
  <main id="board" aria-label="Image board"></main>

  <div class="board-actions">
    <label class="add-action" title="add image" aria-label="add image">
      <span>+</span>
      <input id="fileInput" type="file" accept="image/*" multiple>
    </label>
    <button id="noteButton" class="add-action" type="button" title="add note" aria-label="add note">&amp;</button>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
