<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>eskja</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="board-page">
  <a class="home-icon" href="index.html" aria-label="home" title="home">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 7.2 8 2.8l5.5 4.4M4 6.1v7h8v-7M6.7 13.1V9.3h2.6v3.8"/></svg>
  </a>

  <main id="board" aria-label="Image board"></main>

  <div class="board-actions">
    <label class="add-action" title="add thing" aria-label="add thing">
      <span>+</span>
      <input id="fileInput" type="file" accept="image/*,audio/*,video/*" multiple>
    </label>
    <button id="noteButton" class="add-action" type="button" title="add note" aria-label="add note">&amp;</button>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
